function jsonpCall(url, cb){
  const name="cb_"+Date.now();
  window[name]=function(d){cb(d);delete window[name];s.remove();};
  const s=document.createElement("script");
  s.src=url+"&callback="+name;
  document.head.appendChild(s);
  setTimeout(()=>{if(window[name]){cb(null);delete window[name];s.remove();}},15000);
}

function cargar(){
  const btn=document.getElementById("btn");
  const st=document.getElementById("status");
  btn.disabled=true;
  btn.textContent="Subiendo...";
  st.textContent="⏳ Conectando con Google Sheets...";
  const licsEnc=encodeURIComponent(JSON.stringify(LICS));
  jsonpCall(API+"?action=saveAll&lics="+licsEnc+"&hist=[]", function(res){
    if(res&&res.ok){
      st.innerHTML='<span class="ok">✓ ¡Listo! Datos subidos correctamente.<br>Ya puedes abrir la app en GitHub Pages y ver todas las licitaciones.</span>';
      btn.textContent="✓ Completado";
    }else{
      st.innerHTML='<span class="err">❌ Error. Asegúrate de estar logueada en Google e intenta de nuevo.</span>';
      btn.disabled=false;btn.textContent="Reintentar";
    }
  });
}
